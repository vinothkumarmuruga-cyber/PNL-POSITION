<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; padding: 0; }
    #root { width: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    (function () {
      var root = document.getElementById("root");

      function sendMessage(type, fields) {
        var message = Object.assign({
          isStreamlitMessage: true,
          type: type
        }, fields || {});
        window.parent.postMessage(message, "*");
      }

      function render(args) {
        root.innerHTML = args.html || "";
        root.querySelectorAll("script").forEach(function (oldScript) {
          var script = document.createElement("script");
          Array.from(oldScript.attributes).forEach(function (attribute) {
            script.setAttribute(attribute.name, attribute.value);
          });
          script.textContent = oldScript.textContent;
          oldScript.replaceWith(script);
        });
        sendMessage("streamlit:setFrameHeight", { height: args.height || 1130 });
      }

      window.addEventListener("message", function (event) {
        var message = event.data || {};
        if (message.isStreamlitMessage && message.type === "streamlit:render") {
          render(message.args || {});
        }
      });

      sendMessage("streamlit:componentReady", { apiVersion: 1 });
    })();
  </script>
</body>
</html>
